{% extends 'base.html' %}
{% block content %}
<!-- Encabezado del panel de evaluación para el profesor -->
<div class="mb-10">
    <h2 class="text-3xl font-black text-slate-800 tracking-tight">Evaluación Académica</h2>
    <p class="text-slate-500 mt-2 font-medium">Añade calificaciones para generar recompensas automáticamente.</p>
</div>

<!-- Contenedor centralizado para el formulario de asignación de notas -->
<div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden max-w-xl relative">
    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-indigo-100 to-violet-100 rounded-bl-full z-0 opacity-50"></div>
    <div class="h-2 w-full bg-gradient-to-r from-indigo-500 to-violet-500 relative z-10"></div>
    <div class="p-8 relative z-10">
        <h3 class="text-xl font-bold text-slate-800 mb-8 flex items-center gap-3">
            <div class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path></svg>
            </div>
            Asignar Nota a Alumno
        </h3>
        
        <!-- Formulario POST para enviar la nota y generar puntos automáticamente -->
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Alumno Seleccionado</label>
                <select name="alumno_id" class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none text-slate-800 font-medium bg-slate-50 focus:bg-white transition-all shadow-sm cursor-pointer" required>
                    <option value="" disabled selected>-- Elige un alumno de la lista --</option>
                    {% for alumno in alumnos %}
                    <option value="{{ alumno.username }}">{{ alumno.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Asignatura</label>
                <input type="text" name="asignatura" placeholder="Ej: Matemáticas" class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none text-slate-800 font-medium bg-slate-50 focus:bg-white transition-all shadow-sm placeholder-slate-400" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Calificación (0-10)</label>
                <input type="number" step="0.1" name="nota" min="0" max="10" placeholder="Ej: 8.5" class="w-full px-4 py-3.5 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none text-slate-800 font-medium bg-slate-50 focus:bg-white transition-all shadow-sm placeholder-slate-400" required>
            </div>
            <div class="pt-6">
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-4 px-4 rounded-xl transition-all shadow-lg hover:shadow-xl transform active:scale-95 flex justify-center items-center gap-2">
                    <span>Guardar Nota y Generar Puntos</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
